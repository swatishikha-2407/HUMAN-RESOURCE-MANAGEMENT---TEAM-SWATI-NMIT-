spring.application.name=employee-backend
server.port=${PORT:8080}

# H2 is convenient for a hackathon. Replace these values for PostgreSQL in deployment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/employee_db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# JWT secret must be at least 32 characters in production.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.email-verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}

# Development mode logs verification links instead of requiring SMTP.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

spring.jackson.serialization.write-dates-as-timestamps=false
